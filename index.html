<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>昭和・平成・令和・Z翻訳機</title>
<style>
:root{
  --showa-cream:#f2e8d5;
  --showa-brown:#5b3a29;
  --showa-red:#b8412f;
  --showa-green:#3e5c4a;
  --showa-gold:#c8973a;
  --showa-ink:#2b2018;
  --showa-paper:#fbf5e9;
  --line:#d8c9a8;
  --radio-dark:#3a2a20;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 1px, transparent 1px, transparent 3px),
    var(--showa-cream);
  color:var(--showa-ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:920px;margin:0 auto;padding:0 16px 80px;}

/* ===== ヘッダー：レトロラジオ風 ===== */
header.app-header{
  background:linear-gradient(180deg, var(--radio-dark), #2a1d15);
  color:var(--showa-paper);
  padding:22px 18px 18px;
  border-radius:0 0 18px 18px;
  margin-bottom:18px;
  box-shadow:0 6px 0 rgba(0,0,0,0.15), 0 8px 18px rgba(0,0,0,0.25);
  position:relative;
  overflow:hidden;
}
header.app-header::before{
  content:"";
  position:absolute; inset:0;
  background:repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0 2px, transparent 2px 6px);
  pointer-events:none;
}
.header-row{display:flex; align-items:center; justify-content:space-between; gap:10px; position:relative;}
.brand{display:flex; align-items:center; gap:10px;}
.brand .dial{
  width:38px;height:38px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #c8973a, #8a6422 70%);
  border:2px solid #e8d9a8;
  flex:none;
}
.brand h1{font-size:17px; margin:0; letter-spacing:.04em; font-weight:700;}
.brand .sub{font-size:10px; opacity:.7; letter-spacing:.15em; margin-top:2px;}
.header-actions{display:flex; gap:8px; align-items:center;}
.icon-btn{
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.25);
  color:var(--showa-paper);
  border-radius:8px;
  padding:7px 10px;
  font-size:12px;
  cursor:pointer;
  font-family:inherit;
}
.icon-btn:hover{background:rgba(255,255,255,0.16);}

/* ===== タブナビ ===== */
nav.tabbar{
  display:flex;
  gap:6px;
  background:var(--showa-paper);
  border:1px solid var(--line);
  border-radius:14px;
  padding:6px;
  margin-bottom:18px;
  position:sticky;
  top:8px;
  z-index:20;
  box-shadow:0 4px 12px rgba(91,58,41,0.08);
  overflow-x:auto;
}
nav.tabbar button{
  flex:1;
  white-space:nowrap;
  border:none;
  background:transparent;
  color:var(--showa-brown);
  font-family:inherit;
  font-size:13px;
  font-weight:700;
  padding:9px 8px;
  border-radius:10px;
  cursor:pointer;
}
nav.tabbar button.active{
  background:linear-gradient(180deg, var(--showa-red), #93311f);
  color:#fff;
  box-shadow:0 3px 0 #7a2818;
}

/* ===== カード共通 ===== */
.panel{
  background:var(--showa-paper);
  border:1px solid var(--line);
  border-radius:16px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 3px 10px rgba(91,58,41,0.06);
}
.panel h2{
  margin:0 0 14px;
  font-size:16px;
  color:var(--showa-brown);
  border-left:5px solid var(--showa-red);
  padding-left:10px;
}
.panel h3{font-size:14px; color:var(--showa-brown); margin:18px 0 8px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12px; color:var(--showa-brown); margin-bottom:5px; font-weight:700;}
.field input[type=text],
.field input[type=email],
.field input[type=password],
.field input[type=number],
.field input[type=datetime-local],
.field textarea,
.field select{
  width:100%;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:9px;
  font-size:14px;
  font-family:inherit;
  background:#fff;
  color:var(--showa-ink);
}
.field textarea{resize:vertical; min-height:80px;}
.pw-wrap{position:relative;}
.pw-wrap input{padding-right:60px;}
.pw-toggle{
  position:absolute; right:6px; top:50%; transform:translateY(-50%);
  background:var(--showa-cream); border:1px solid var(--line); border-radius:6px;
  font-size:11px; padding:5px 8px; cursor:pointer; color:var(--showa-brown);
}
.hint{font-size:11px; color:#8a7257; margin-top:4px;}

.btn{
  display:inline-block;
  background:linear-gradient(180deg, var(--showa-red), #93311f);
  color:#fff;
  border:none;
  padding:11px 20px;
  border-radius:10px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  font-family:inherit;
  box-shadow:0 3px 0 #7a2818;
}
.btn:active{transform:translateY(2px); box-shadow:0 1px 0 #7a2818;}
.btn.secondary{
  background:var(--showa-paper);
  color:var(--showa-brown);
  border:1px solid var(--showa-brown);
  box-shadow:none;
}
.btn.ghost{
  background:transparent; color:var(--showa-brown); border:1px dashed var(--line); box-shadow:none;
}
.btn.small{padding:7px 12px; font-size:12px;}
.btn:disabled{opacity:.5; cursor:not-allowed; box-shadow:none;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:6px;}

.msg{
  padding:10px 14px; border-radius:9px; font-size:13px; margin-bottom:14px;
}
.msg.error{background:#f6dcd6; color:#8a2e1c; border:1px solid #e0a99a;}
.msg.success{background:#dfe9de; color:#2f4d36; border:1px solid #aecaa9;}

.link-btn{background:none; border:none; color:var(--showa-red); text-decoration:underline; cursor:pointer; font-size:12px; padding:0; font-family:inherit;}

/* ===== 免責事項ボックス ===== */
.terms-box{
  max-height:260px; overflow-y:auto;
  background:#fff; border:1px solid var(--line); border-radius:10px;
  padding:14px; font-size:12px; line-height:1.8; color:#4a3a2a;
  white-space:pre-wrap;
  margin-bottom:10px;
}
.agree-row{display:flex; align-items:flex-start; gap:8px; font-size:13px;}
.agree-row input{margin-top:3px;}

/* ===== 翻訳機 ===== */
.translate-stage{
  background:linear-gradient(180deg, #2a3a30, #1d2820);
  border-radius:14px;
  padding:18px;
  margin-bottom:16px;
  position:relative;
}
.translate-stage::before{
  content:"";
  position:absolute; inset:8px;
  border:2px solid rgba(200,151,58,0.3);
  border-radius:8px;
  pointer-events:none;
}
.translate-result{
  min-height:64px;
  color:#e9f5e9;
  font-size:15px;
  line-height:1.7;
  font-family:"Courier New", monospace;
  white-space:pre-wrap;
  padding:6px 4px;
}
.translate-result.placeholder{color:rgba(233,245,233,0.4); font-size:13px;}
.gen-select{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;}
.gen-chip{
  flex:1; min-width:70px;
  text-align:center;
  padding:10px 6px;
  border:2px solid var(--line);
  border-radius:10px;
  cursor:pointer;
  font-size:13px;
  font-weight:700;
  color:var(--showa-brown);
  background:#fff;
}
.gen-chip.active{
  background:var(--showa-gold);
  border-color:#8a6422;
  color:#3a2a10;
}

/* ===== イベントカード ===== */
.event-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  padding:14px 16px;
  margin-bottom:12px;
  position:relative;
}
.event-card .badge{
  position:absolute; top:12px; right:12px;
  font-size:11px; padding:3px 9px; border-radius:20px; font-weight:700;
}
.badge.open{background:#dfe9de; color:#2f4d36;}
.badge.closed{background:#e6e0d0; color:#6b5b3f;}
.event-card h4{margin:0 6px 8px 0; font-size:15px; color:var(--showa-brown); max-width:78%;}
.event-meta{font-size:12px; color:#6b5b3f; margin-bottom:4px;}
.event-desc{font-size:13px; color:#3a2a1a; margin:8px 0; white-space:pre-wrap;}
.event-foot{display:flex; justify-content:space-between; align-items:center; margin-top:10px; flex-wrap:wrap; gap:8px;}
.owner-tag{font-size:11px; color:#8a7257;}

.participant-list{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line);}
.participant-item{font-size:12px; padding:5px 0; display:flex; justify-content:space-between; color:#3a2a1a;}
.participant-item .sns{color:#8a7257;}

.empty-state{text-align:center; padding:30px 10px; color:#8a7257; font-size:13px;}

footer.app-footer{
  text-align:center; font-size:11px; color:#8a7257; padding:20px 10px;
}

/* レスポンシブ: PC幅で少し余白を持たせる */
@media (min-width:760px){
  #app{padding-top:10px;}
  .gen-select{justify-content:center;}
}

.howto-link{
  display:block; text-align:center; margin-top:6px; font-size:12px;
}
</style>
</head>
<body>
<div id="app">

  <header class="app-header">
    <div class="header-row">
      <div class="brand">
        <div class="dial"></div>
        <div>
          <h1>昭和・平成・令和・Z翻訳機</h1>
          <div class="sub">SEDAIKAN HONYAKUKI</div>
        </div>
      </div>
      <div class="header-actions" id="headerActions"></div>
    </div>
  </header>

  <nav class="tabbar" id="tabbar"></nav>

  <main id="main"></main>

  <footer class="app-footer">
    © 昭和・平成・令和・Z翻訳機 ｜ 有志ボランティア運営
  </footer>
</div>

<script>
/* ===== 設定 ===== */
const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyfKFEaiyxRnMYtsjlmkrlq90tim7iQAvJrgh2ZQORxmT7JsgA5lsCLS2qFssaIlvONAg/exec";

/* ===== 共通ユーティリティ ===== */
function escHtml(str){
  if(str === null || str === undefined) return "";
  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function isMobile(){
  return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth < 760;
}
document.documentElement.classList.add(isMobile() ? "is-mobile" : "is-pc");

async function callApi(action, payload){
  payload = payload || {};
  payload.action = action;
  const res = await fetch(GAS_API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    redirect: "follow",
    body: JSON.stringify(payload)
  });
  if(!res.ok){
    throw new Error("通信エラーが発生しました（status " + res.status + "）");
  }
  return await res.json();
}

/* ===== アプリ状態 ===== */
const state = {
  token: sessionStorage.getItem("sh_token") || null,
  profile: JSON.parse(sessionStorage.getItem("sh_profile") || "null"),
  adminToken: sessionStorage.getItem("sh_admin_token") || null,
  currentTab: "translate",
  events: [],
};

function isLoggedIn(){ return !!state.token; }
function isAdmin(){ return !!state.adminToken; }

function setSession(token, profile){
  state.token = token;
  state.profile = profile;
  sessionStorage.setItem("sh_token", token);
  sessionStorage.setItem("sh_profile", JSON.stringify(profile));
}
function clearSession(){
  state.token = null;
  state.profile = null;
  sessionStorage.removeItem("sh_token");
  sessionStorage.removeItem("sh_profile");
}
function setAdminSession(token){
  state.adminToken = token;
  sessionStorage.setItem("sh_admin_token", token);
}
function clearAdminSession(){
  state.adminToken = null;
  sessionStorage.removeItem("sh_admin_token");
}

/* ===== ルーター（タブ） ===== */
const TABS = [
  { id:"translate", label:"翻訳機" },
  { id:"events", label:"イベント" },
  { id:"mypage", label:"マイページ" },
  { id:"howto", label:"使い方" },
  { id:"admin", label:"管理者" },
];

function renderTabbar(){
  const bar = document.getElementById("tabbar");
  bar.innerHTML = "";
  TABS.forEach(t=>{
    const btn = document.createElement("button");
    btn.textContent = t.label;
    if(state.currentTab === t.id) btn.classList.add("active");
    btn.onclick = ()=>{ state.currentTab = t.id; renderAll(); };
    bar.appendChild(btn);
  });
}

function renderHeaderActions(){
  const el = document.getElementById("headerActions");
  el.innerHTML = "";
  if(isLoggedIn()){
    const span = document.createElement("span");
    span.style.fontSize = "11px";
    span.style.opacity = "0.85";
    span.textContent = (state.profile && state.profile.nickname) ? state.profile.nickname + " さん" : "";
    el.appendChild(span);
    const btn = document.createElement("button");
    btn.className = "icon-btn";
    btn.textContent = "ログアウト";
    btn.onclick = ()=>{ clearSession(); state.currentTab = "translate"; renderAll(); };
    el.appendChild(btn);
  } else {
    const btn = document.createElement("button");
    btn.className = "icon-btn";
    btn.textContent = "ログイン";
    btn.onclick = ()=>{ state.currentTab = "mypage"; renderAll(); };
    el.appendChild(btn);
  }
}

function renderAll(){
  renderTabbar();
  renderHeaderActions();
  const main = document.getElementById("main");
  main.innerHTML = "";
  if(state.currentTab === "translate") renderTranslateTab(main);
  else if(state.currentTab === "events") renderEventsTab(main);
  else if(state.currentTab === "mypage") renderMypageTab(main);
  else if(state.currentTab === "howto") renderHowtoTab(main);
  else if(state.currentTab === "admin") renderAdminTab(main);
  window.scrollTo({top:0, behavior:"instant"});
}

renderAll();
</script>

<script>
/* ===== 共通: メッセージ表示 ===== */
function msgHtml(text, type){
  if(!text) return "";
  return '<div class="msg ' + type + '">' + escHtml(text) + '</div>';
}

/* =========================================================
   翻訳機タブ
========================================================= */
const GENERATIONS = ["昭和","平成","令和","Z"];

function renderTranslateTab(main){
  const panel = document.createElement("div");
  panel.className = "panel";
  panel.innerHTML =
    '<h2>世代間ことば翻訳機</h2>' +
    '<div class="field">' +
      '<label>翻訳したい言葉</label>' +
      '<textarea id="trInput" placeholder="例：それな、わかりみが深い"></textarea>' +
    '</div>' +
    '<div class="field">' +
      '<label>変換先の世代を選んでください</label>' +
      '<div class="gen-select" id="genSelect"></div>' +
    '</div>' +
    '<div id="trMsg"></div>' +
    '<div class="btn-row">' +
      '<button class="btn" id="trGoBtn">翻訳する</button>' +
    '</div>' +
    '<div class="translate-stage">' +
      '<div class="translate-result placeholder" id="trResult">ここに翻訳結果が表示されます。</div>' +
    '</div>' +
    '<p class="hint">※ AIによる自動翻訳です。雰囲気を楽しむための機能としてご利用ください。</p>';
  main.appendChild(panel);

  let selectedGen = "令和";
  const genSelect = panel.querySelector("#genSelect");
  GENERATIONS.forEach(g=>{
    const chip = document.createElement("div");
    chip.className = "gen-chip" + (g===selectedGen ? " active" : "");
    chip.textContent = g + "世代風";
    chip.onclick = ()=>{
      selectedGen = g;
      genSelect.querySelectorAll(".gen-chip").forEach(c=>c.classList.remove("active"));
      chip.classList.add("active");
    };
    genSelect.appendChild(chip);
  });

  panel.querySelector("#trGoBtn").onclick = async ()=>{
    const text = panel.querySelector("#trInput").value.trim();
    const msgEl = panel.querySelector("#trMsg");
    const resultEl = panel.querySelector("#trResult");
    msgEl.innerHTML = "";
    if(!text){
      msgEl.innerHTML = msgHtml("翻訳したい言葉を入力してください。", "error");
      return;
    }
    const btn = panel.querySelector("#trGoBtn");
    btn.disabled = true;
    btn.textContent = "翻訳中…";
    resultEl.classList.add("placeholder");
    resultEl.textContent = "翻訳しています…";
    try{
      const res = await callApi("translate", { text: text, targetGeneration: selectedGen });
      if(res.ok){
        resultEl.classList.remove("placeholder");
        resultEl.textContent = res.result;
      } else {
        msgEl.innerHTML = msgHtml(res.error || "翻訳に失敗しました。", "error");
        resultEl.classList.add("placeholder");
        resultEl.textContent = "ここに翻訳結果が表示されます。";
      }
    } catch(err){
      msgEl.innerHTML = msgHtml("通信エラーが発生しました。時間をおいて再度お試しください。", "error");
    } finally {
      btn.disabled = false;
      btn.textContent = "翻訳する";
    }
  };
}

/* =========================================================
   イベントタブ
========================================================= */
function formatDateTime(s){
  if(!s) return "";
  const d = new Date(s);
  if(isNaN(d.getTime())) return s;
  return d.getFullYear() + "/" + (d.getMonth()+1) + "/" + d.getDate() + " " +
    String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}

async function renderEventsTab(main){
  if(!isLoggedIn()){
    const panel = document.createElement("div");
    panel.className = "panel";
    panel.innerHTML =
      '<h2>イベント</h2>' +
      '<p>イベントの閲覧・参加にはログインが必要です。</p>' +
      '<div class="btn-row"><button class="btn" id="goLoginBtn">ログインする</button></div>';
    main.appendChild(panel);
    panel.querySelector("#goLoginBtn").onclick = ()=>{ state.currentTab = "mypage"; renderAll(); };
    return;
  }

  const headerPanel = document.createElement("div");
  headerPanel.className = "panel";
  headerPanel.innerHTML =
    '<h2>イベント一覧</h2>' +
    '<div class="btn-row"><button class="btn" id="newEventBtn">＋ イベントを企画する</button></div>' +
    '<div id="eventsMsg"></div>';
  main.appendChild(headerPanel);

  const listWrap = document.createElement("div");
  listWrap.id = "eventsList";
  listWrap.innerHTML = '<div class="empty-state">読み込み中…</div>';
  main.appendChild(listWrap);

  headerPanel.querySelector("#newEventBtn").onclick = ()=> openEventForm(null);

  await loadAndRenderEvents();
}

async function loadAndRenderEvents(){
  const listWrap = document.getElementById("eventsList");
  if(!listWrap) return;
  try{
    const res = await callApi("listEvents", {});
    if(!res.ok){
      listWrap.innerHTML = '<div class="empty-state">' + escHtml(res.error || "イベントの取得に失敗しました。") + '</div>';
      return;
    }
    state.events = res.events || [];
    if(state.events.length === 0){
      listWrap.innerHTML = '<div class="empty-state">まだイベントが登録されていません。最初の企画者になりませんか？</div>';
      return;
    }
    listWrap.innerHTML = "";
    state.events.forEach(ev=> listWrap.appendChild(buildEventCard(ev)));
  } catch(err){
    listWrap.innerHTML = '<div class="empty-state">通信エラーが発生しました。</div>';
  }
}

function buildEventCard(ev){
  const card = document.createElement("div");
  card.className = "event-card";
  const isOwner = state.profile && ev.ownerNickname === state.profile.nickname;
  const closed = ev.status === "closed" || ev.status === "cancelled";

  card.innerHTML =
    '<span class="badge ' + (closed ? "closed" : "open") + '">' + (closed ? "募集終了" : "募集中") + '</span>' +
    '<h4>' + escHtml(ev.title) + '</h4>' +
    '<div class="event-meta">📅 ' + escHtml(formatDateTime(ev.datetime)) + (ev.place ? "　📍 " + escHtml(ev.place) : "") + '</div>' +
    '<div class="event-meta">定員 ' + escHtml(ev.capacity || "未設定") + '名 ／ 参加表明 ' + escHtml(ev.joinedCount) + '名' +
      (ev.deadline ? "　／ 締切 " + escHtml(formatDateTime(ev.deadline)) : "") + '</div>' +
    '<div class="event-desc">' + escHtml(ev.description || "") + '</div>' +
    '<div class="owner-tag">企画者：' + escHtml(ev.ownerNickname) + '</div>' +
    '<div class="event-foot" id="foot-' + ev.eventId + '"></div>' +
    '<div class="participant-list" id="plist-' + ev.eventId + '"></div>';

  const foot = card.querySelector('#foot-' + cssEscape(ev.eventId));
  const joinBtn = document.createElement("button");
  joinBtn.className = "btn small";
  joinBtn.textContent = closed ? "募集終了" : "参加表明する";
  joinBtn.disabled = closed;
  joinBtn.onclick = ()=> openJoinForm(ev);
  foot.appendChild(joinBtn);

  const declineBtn = document.createElement("button");
  declineBtn.className = "btn small secondary";
  declineBtn.textContent = "不参加にする";
  declineBtn.onclick = async ()=>{
    await callApi("leaveEvent", { token: state.token, eventId: ev.eventId });
    await loadAndRenderEvents();
  };
  foot.appendChild(declineBtn);

  const toggleBtn = document.createElement("button");
  toggleBtn.className = "btn small ghost";
  toggleBtn.textContent = "参加者一覧を見る";
  toggleBtn.onclick = ()=> toggleParticipants(ev.eventId);
  foot.appendChild(toggleBtn);

  if(isOwner){
    const editBtn = document.createElement("button");
    editBtn.className = "btn small secondary";
    editBtn.textContent = "編集";
    editBtn.onclick = ()=> openEventForm(ev);
    foot.appendChild(editBtn);

    const delBtn = document.createElement("button");
    delBtn.className = "btn small ghost";
    delBtn.textContent = "削除";
    delBtn.onclick = async ()=>{
      if(!confirm("このイベントを削除します。よろしいですか？")) return;
      await callApi("deleteEvent", { token: state.token, eventId: ev.eventId });
      await loadAndRenderEvents();
    };
    foot.appendChild(delBtn);
  }

  return card;
}

function cssEscape(id){
  return id.replace(/[^a-zA-Z0-9_-]/g, "_");
}

async function toggleParticipants(eventId){
  const wrap = document.getElementById('plist-' + cssEscape(eventId));
  if(!wrap) return;
  if(wrap.dataset.open === "true"){
    wrap.innerHTML = "";
    wrap.dataset.open = "false";
    return;
  }
  wrap.innerHTML = '<div class="hint">読み込み中…</div>';
  const res = await callApi("getParticipants", { eventId: eventId });
  if(!res.ok){
    wrap.innerHTML = '<div class="hint">取得に失敗しました。</div>';
    return;
  }
  if(res.participants.length === 0){
    wrap.innerHTML = '<div class="hint">まだ参加表明がありません。</div>';
  } else {
    wrap.innerHTML = res.participants.map(p=>
      '<div class="participant-item"><span>' + escHtml(p.nickname) + '（' + escHtml(p.count) + '名）</span><span class="sns">' + escHtml(p.sns || "") + '</span></div>'
    ).join("");
  }
  wrap.dataset.open = "true";
}

function openJoinForm(ev){
  const count = prompt("参加人数（同伴者含む）を入力してください", "1");
  if(count === null) return;
  const n = Number(count);
  if(!n || n < 1){ alert("正しい人数を入力してください。"); return; }
  callApi("joinEvent", { token: state.token, eventId: ev.eventId, count: n }).then(res=>{
    if(!res.ok){ alert(res.error || "参加登録に失敗しました。"); }
    loadAndRenderEvents();
  });
}

function openEventForm(ev){
  const isEdit = !!ev;
  const overlay = document.createElement("div");
  overlay.style.cssText = "position:fixed;inset:0;background:rgba(43,32,24,0.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 12px;";
  overlay.innerHTML =
    '<div class="panel" style="max-width:520px;width:100%;margin:0;">' +
      '<h2>' + (isEdit ? "イベントを編集" : "イベントを企画する") + '</h2>' +
      '<div id="evFormMsg"></div>' +
      '<div class="field"><label>イベント名</label><input type="text" id="evTitle" value="' + (isEdit ? escHtml(ev.title) : "") + '"></div>' +
      '<div class="field"><label>概要</label><textarea id="evDesc">' + (isEdit ? escHtml(ev.description) : "") + '</textarea></div>' +
      '<div class="field"><label>日時</label><input type="datetime-local" id="evDatetime" value="' + (isEdit ? toLocalInputValue(ev.datetime) : "") + '"></div>' +
      '<div class="field"><label>開催場所</label><input type="text" id="evPlace" value="' + (isEdit ? escHtml(ev.place) : "") + '"></div>' +
      '<div class="field"><label>募集人数</label><input type="number" id="evCapacity" min="1" value="' + (isEdit ? escHtml(ev.capacity) : "") + '"></div>' +
      '<div class="field"><label>募集期限</label><input type="datetime-local" id="evDeadline" value="' + (isEdit ? toLocalInputValue(ev.deadline) : "") + '"></div>' +
      '<div class="btn-row">' +
        '<button class="btn" id="evSaveBtn">' + (isEdit ? "更新する" : "登録する") + '</button>' +
        '<button class="btn secondary" id="evCancelBtn">キャンセル</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(overlay);

  overlay.querySelector("#evCancelBtn").onclick = ()=> overlay.remove();

  overlay.querySelector("#evSaveBtn").onclick = async ()=>{
    const title = overlay.querySelector("#evTitle").value.trim();
    const description = overlay.querySelector("#evDesc").value.trim();
    const datetime = overlay.querySelector("#evDatetime").value;
    const place = overlay.querySelector("#evPlace").value.trim();
    const capacity = overlay.querySelector("#evCapacity").value;
    const deadline = overlay.querySelector("#evDeadline").value;
    const msgEl = overlay.querySelector("#evFormMsg");

    if(!title || !datetime){
      msgEl.innerHTML = msgHtml("イベント名と日時は必須です。", "error");
      return;
    }

    const payload = { token: state.token, title, description, datetime, place, capacity, deadline };
    let res;
    if(isEdit){
      payload.eventId = ev.eventId;
      res = await callApi("updateEvent", payload);
    } else {
      res = await callApi("createEvent", payload);
    }

    if(res.ok){
      overlay.remove();
      await loadAndRenderEvents();
    } else {
      msgEl.innerHTML = msgHtml(res.error || "保存に失敗しました。", "error");
    }
  };
}

function toLocalInputValue(s){
  if(!s) return "";
  const d = new Date(s);
  if(isNaN(d.getTime())) return "";
  const pad = n => String(n).padStart(2,"0");
  return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
}

function bindPasswordToggle(scope){
  scope.querySelectorAll(".pw-toggle").forEach(btn=>{
    btn.onclick = ()=>{
      const input = scope.querySelector("#" + btn.dataset.target);
      if(input.type === "password"){
        input.type = "text";
        btn.textContent = "非表示";
      } else {
        input.type = "password";
        btn.textContent = "表示";
      }
    };
  });
}

async function loadAdminEvents(listEl){
  const res = await callApi("adminListEvents", { adminToken: state.adminToken });
  if(!res.ok){
    listEl.innerHTML = '<div class="empty-state">' + escHtml(res.error || "取得に失敗しました。") + '</div>';
    if(res.error && res.error.indexOf("セッション") !== -1){
      clearAdminSession();
    }
    return;
  }
  if(res.events.length === 0){
    listEl.innerHTML = '<div class="empty-state">イベントがありません。</div>';
    return;
  }
  listEl.innerHTML = "";
  res.events.forEach(ev=>{
    const closed = ev.status === "closed" || ev.status === "cancelled";
    const row = document.createElement("div");
    row.className = "event-card";
    row.innerHTML =
      '<span class="badge ' + (closed ? "closed" : "open") + '">' + (closed ? "募集終了" : "募集中") + '</span>' +
      '<h4>' + escHtml(ev.title) + '</h4>' +
      '<div class="event-meta">📅 ' + escHtml(formatDateTime(ev.datetime)) + (ev.place ? "　📍 " + escHtml(ev.place) : "") + '</div>' +
      '<div class="event-meta">参加表明 ' + escHtml(ev.joinedCount) + '名</div>' +
      '<div class="owner-tag">企画者：' + escHtml(ev.ownerNickname) + '（' + escHtml(ev.ownerEmail) + '）</div>' +
      '<div class="event-foot"></div>';
    const foot = row.querySelector(".event-foot");
    const delBtn = document.createElement("button");
    delBtn.className = "btn small ghost";
    delBtn.textContent = "強制削除";
    delBtn.onclick = async ()=>{
      if(!confirm('「' + ev.title + '」を強制削除します。参加者データも削除されます。よろしいですか？')) return;
      const delRes = await callApi("adminDeleteEvent", { adminToken: state.adminToken, eventId: ev.eventId });
      if(!delRes.ok){ alert(delRes.error || "削除に失敗しました。"); return; }
      await loadAdminEvents(listEl);
    };
    foot.appendChild(delBtn);
    listEl.appendChild(row);
  });
}

async function loadAdminMembers(listEl){
  const res = await callApi("adminListMembers", { adminToken: state.adminToken });
  if(!res.ok){
    listEl.innerHTML = '<div class="empty-state">' + escHtml(res.error || "取得に失敗しました。") + '</div>';
    if(res.error && res.error.indexOf("セッション") !== -1){
      clearAdminSession();
    }
    return;
  }
  if(res.members.length === 0){
    listEl.innerHTML = '<div class="empty-state">会員がいません。</div>';
    return;
  }
  listEl.innerHTML = "";
  res.members.forEach(m=>{
    const row = document.createElement("div");
    row.className = "event-card";
    row.innerHTML =
      '<h4 style="max-width:100%;">' + escHtml(m.nickname) + '　<span style="font-size:11px;font-weight:400;color:#8a7257;">(' + escHtml(m.role) + ')</span></h4>' +
      '<div class="event-meta">' + escHtml(m.email) + '</div>' +
      '<div class="event-meta">SNS: ' + escHtml(m.sns || "未登録") + '　／　状態: ' + (m.status === "active" ? "有効" : "停止中") + '</div>' +
      '<div class="event-foot"></div>';
    const foot = row.querySelector(".event-foot");
    const toggleBtn = document.createElement("button");
    toggleBtn.className = "btn small " + (m.status === "active" ? "ghost" : "secondary");
    toggleBtn.textContent = m.status === "active" ? "利用停止にする" : "利用再開する";
    toggleBtn.onclick = async ()=>{
      const newStatus = m.status === "active" ? "suspended" : "active";
      await callApi("adminUpdateMemberStatus", { adminToken: state.adminToken, email: m.email, status: newStatus });
      await loadAdminMembers(listEl);
    };
    foot.appendChild(toggleBtn);
    listEl.appendChild(row);
  });
}
</script>

</body>
